---
# Multi-domain SD-WAN sites.
#
# cEdge-01 (Site 2): HUB facing the ACI border leaf (eth1/1 on node 403).
#   Two dot1q sub-interfaces on Gi3:
#     Gi3.3010  VPN30 CORP   10.100.10.2/30  EBGP peer 10.100.10.1 AS 65100
#     Gi3.3020  VPN40 GUEST  10.100.20.2/30  EBGP peer 10.100.20.1 AS 65100
#
# cEdge-02 (Site 3): facing the CATC border BR10 (Gi1/0/3).
#   Two dot1q sub-interfaces on Gi3:
#     Gi3.3030  VPN30 CORP   10.100.30.2/30  EBGP peer 10.100.30.1 AS 65001
#     Gi3.3040  VPN40 GUEST  10.100.40.2/30  EBGP peer 10.100.40.1 AS 65001
sdwan:
  sites:
    # ─────────────────────────────────────────────────────────────────────
    # SITE 2 — cEdge-01 (HUB, ACI-facing)
    # ─────────────────────────────────────────────────────────────────────
    - id: 2
      routers:
        - chassis_id: C8K-D4CE7174-5261-7E6F-91EA-4926BCF4C2DD
          model: C8000V
          device_template: DT-HUB-C8000V-MULTIDOMAIN
          device_variables:
            # System
            site_id: 2
            system_ip: 10.0.0.2
            system_hostname: SD-SITE2-C8KV-01
            controller_groups: 1,2
            timezone: UTC
            system_description: Site 2 C8KV01 (HUB ACI-facing)
            system_location: Site2
            system_latitude: 38.1
            system_longitude: -1.9
            ondemand_tunnel_enable: false
            ondemand_tunnel_idle_timeout: 10

            # Global
            global_cdp_enable: true
            global_lldp_enable: false
            global_ip_domain_lookup_enable: true

            # Source-interface anchors for logging/NTP/SNMP (use TLOC1)
            logging_server_source_interface: GigabitEthernet1
            ntp_server_source_interface: GigabitEthernet1
            snmp_contact: sac-admin@cisco.com
            snmp_location: Location Site2
            snmp_shutdown: false
            snmp_trap_source_interface: GigabitEthernet1

            # VPN0 overlay + TLOCs (biz-internet + mpls)
            vpn0_dns_primary: 172.16.1.254
            vpn0_dns_secondary: 172.16.2.254
            vpn0_layer4_ecmp_enable: true
            vpn0_ipv4_route1_nexthop1_ip: 172.16.1.254
            vpn0_ipv4_route1_nexthop1_distance: 1
            vpn0_ipv4_route1_nexthop2_ip: 172.16.2.254
            vpn0_ipv4_route1_nexthop2_distance: 1

            vpn0_tloc01_if_name: GigabitEthernet1
            vpn0_tloc01_if_description: INET-1
            vpn0_tloc01_if_ipv4_address: 172.16.1.2/24
            vpn0_tloc01_if_shutdown: false
            vpn0_tloc01_shaping_rate: 1000000
            vpn0_tloc01_tunnel_color: biz-internet
            vpn0_tloc01_tunnel_restrict: false
            vpn0_tloc01_tunnel_ipsec_preference: 1000
            vpn0_tloc01_tunnel_weight: 1
            vpn0_tloc01_tunnel_group: 100
            vpn0_tloc01_tunnel_vmanage_connection_preference: 5

            vpn0_tloc02_if_name: GigabitEthernet2
            vpn0_tloc02_if_description: MPLS-1
            vpn0_tloc02_if_ipv4_address: 172.16.2.2/24
            vpn0_tloc02_if_shutdown: false
            vpn0_tloc02_shaping_rate: 1000000
            vpn0_tloc02_tunnel_color: mpls
            vpn0_tloc02_tunnel_restrict: false
            vpn0_tloc02_tunnel_ipsec_preference: 1000
            vpn0_tloc02_tunnel_weight: 1
            vpn0_tloc02_tunnel_group: 200
            vpn0_tloc02_tunnel_vmanage_connection_preference: 5

            # VPN 30 service settings (no default route here; OMP carries CATC reachability)
            vpn30_default_route_prefix: 0.0.0.0/0
            vpn30_default_route_next_hop: 10.100.10.1
            vpn30_default_route_distance: 1

            # VPN 40 service settings
            vpn40_default_route_prefix: 0.0.0.0/0
            vpn40_default_route_next_hop: 10.100.20.1
            vpn40_default_route_distance: 1

            # Handoff TCP MSS (clamp for SD-WAN tunnel overhead)
            handoff_tcp_mss: 1350

            # ── VPN30 handoff sub-interface and BGP toward ACI L3Out PROD ──
            handoff_vpn30_subif_if_name: GigabitEthernet3.3010
            handoff_vpn30_subif_desc: HANDOFF to ACI L3OUT-SDWAN-PROD (node 403 eth1/1 VLAN 3010)
            handoff_vpn30_subif_ipv4: 10.100.10.2/30
            handoff_vpn30_subif_shutdown: false
            handoff_vpn30_bgp_router_id: 10.0.0.2
            handoff_vpn30_bgp_peer: 10.100.10.1
            handoff_vpn30_bgp_remote_as: 65100

            # ── VPN40 handoff sub-interface and BGP toward ACI L3Out SVCS ──
            handoff_vpn40_subif_if_name: GigabitEthernet3.3020
            handoff_vpn40_subif_desc: HANDOFF to ACI L3OUT-SDWAN-SVCS (node 403 eth1/1 VLAN 3020)
            handoff_vpn40_subif_ipv4: 10.100.20.2/30
            handoff_vpn40_subif_shutdown: false
            handoff_vpn40_bgp_router_id: 10.0.0.2
            handoff_vpn40_bgp_peer: 10.100.20.1
            handoff_vpn40_bgp_remote_as: 65100

    # ─────────────────────────────────────────────────────────────────────
    # SITE 3 — cEdge-02 (CATC-facing)
    # ─────────────────────────────────────────────────────────────────────
    - id: 3
      routers:
        - chassis_id: C8K-PLACEHOLDER-CHASSIS-CEDGE02-SITE3-XXXXXXXX
          model: C8000V
          device_template: DT-HUB-C8000V-MULTIDOMAIN
          device_variables:
            # System
            site_id: 3
            system_ip: 10.0.0.3
            system_hostname: SD-SITE3-C8KV-01
            controller_groups: 1,2
            timezone: UTC
            system_description: Site 3 C8KV01 (CATC-facing)
            system_location: Site3
            system_latitude: 50.06
            system_longitude: 19.94
            ondemand_tunnel_enable: false
            ondemand_tunnel_idle_timeout: 10

            # Global
            global_cdp_enable: true
            global_lldp_enable: false
            global_ip_domain_lookup_enable: true

            # Source-interface anchors
            logging_server_source_interface: GigabitEthernet1
            ntp_server_source_interface: GigabitEthernet1
            snmp_contact: krk-admin@cisco.com
            snmp_location: Location Site3
            snmp_shutdown: false
            snmp_trap_source_interface: GigabitEthernet1

            # VPN0 overlay + TLOCs
            vpn0_dns_primary: 172.16.1.254
            vpn0_dns_secondary: 172.16.2.254
            vpn0_layer4_ecmp_enable: true
            vpn0_ipv4_route1_nexthop1_ip: 172.16.1.254
            vpn0_ipv4_route1_nexthop1_distance: 1
            vpn0_ipv4_route1_nexthop2_ip: 172.16.2.254
            vpn0_ipv4_route1_nexthop2_distance: 1

            vpn0_tloc01_if_name: GigabitEthernet1
            vpn0_tloc01_if_description: INET-1
            vpn0_tloc01_if_ipv4_address: 172.16.1.3/24
            vpn0_tloc01_if_shutdown: false
            vpn0_tloc01_shaping_rate: 1000000
            vpn0_tloc01_tunnel_color: biz-internet
            vpn0_tloc01_tunnel_restrict: false
            vpn0_tloc01_tunnel_ipsec_preference: 1000
            vpn0_tloc01_tunnel_weight: 1
            vpn0_tloc01_tunnel_group: 100
            vpn0_tloc01_tunnel_vmanage_connection_preference: 5

            vpn0_tloc02_if_name: GigabitEthernet2
            vpn0_tloc02_if_description: MPLS-1
            vpn0_tloc02_if_ipv4_address: 172.16.2.3/24
            vpn0_tloc02_if_shutdown: false
            vpn0_tloc02_shaping_rate: 1000000
            vpn0_tloc02_tunnel_color: mpls
            vpn0_tloc02_tunnel_restrict: false
            vpn0_tloc02_tunnel_ipsec_preference: 1000
            vpn0_tloc02_tunnel_weight: 1
            vpn0_tloc02_tunnel_group: 200
            vpn0_tloc02_tunnel_vmanage_connection_preference: 5

            # VPN 30/40 service settings
            vpn30_default_route_prefix: 0.0.0.0/0
            vpn30_default_route_next_hop: 10.100.30.1
            vpn30_default_route_distance: 1
            vpn40_default_route_prefix: 0.0.0.0/0
            vpn40_default_route_next_hop: 10.100.40.1
            vpn40_default_route_distance: 1

            # Handoff TCP MSS
            handoff_tcp_mss: 1350

            # ── VPN30 handoff sub-interface and BGP toward CATC Campus VN ──
            handoff_vpn30_subif_if_name: GigabitEthernet3.3030
            handoff_vpn30_subif_desc: HANDOFF to CATC BR10 Campus VN (Gi1/0/3 VLAN 3030)
            handoff_vpn30_subif_ipv4: 10.100.30.2/30
            handoff_vpn30_subif_shutdown: false
            handoff_vpn30_bgp_router_id: 10.0.0.3
            handoff_vpn30_bgp_peer: 10.100.30.1
            handoff_vpn30_bgp_remote_as: 65001

            # ── VPN40 handoff sub-interface and BGP toward CATC Guest VN ──
            handoff_vpn40_subif_if_name: GigabitEthernet3.3040
            handoff_vpn40_subif_desc: HANDOFF to CATC BR10 Guest VN (Gi1/0/3 VLAN 3040)
            handoff_vpn40_subif_ipv4: 10.100.40.2/30
            handoff_vpn40_subif_shutdown: false
            handoff_vpn40_bgp_router_id: 10.0.0.3
            handoff_vpn40_bgp_peer: 10.100.40.1
            handoff_vpn40_bgp_remote_as: 65001
