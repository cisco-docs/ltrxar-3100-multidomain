---
image:
  name: danischm/nac:latest
  pull_policy: if-not-present

stages:
  - validate
  - plan
  - deploy
  - destroy

variables:
  GIT_SSL_NO_VERIFY: "true"

  ACI_USERNAME:
    description: "Cisco ACI Username"
  ACI_PASSWORD:
    description: "Cisco ACI Password"
  ACI_URL:
    description: "Cisco ACI URL"
  GITLAB_TOKEN:
    description: "User Access Token. Used to create comments on Merge Requests"
  TF_HTTP_USERNAME:
    description: "GitLab Username"
    value: "gitlab-ci-token"
  TF_HTTP_PASSWORD:
    description: "GitLab Access Token"
    value: "${GITLAB_TOKEN}"
  GITLAB_API_URL:
    description: "GitLab API v4 root URL"
    value: "${CI_API_V4_URL}"
  TF_STATE_NAME:
    description: "Terraform state name (per branch)"
    value: "mdo-aci-${CI_COMMIT_REF_SLUG}"
  TF_HTTP_ADDRESS:
    value: "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_HTTP_LOCK_ADDRESS:
    value: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_LOCK_METHOD:
    value: POST
  TF_HTTP_UNLOCK_ADDRESS:
    value: "${TF_HTTP_ADDRESS}/lock"
  TF_HTTP_UNLOCK_METHOD:
    value: DELETE

before_script:
  - update-ca-certificates
  - cd multi-domain/aci

cache:
  key: mdo_aci_terraform_modules
  paths:
    - multi-domain/aci/.terraform
    - multi-domain/aci/.terraform.lock.hcl
    - multi-domain/aci/defaults.yaml

validate:
  stage: validate
  script:
    - set -o pipefail && terraform fmt -check |& tee fmt_output.txt
    - set -o pipefail && nac-validate ./data/ |& tee validate_output.txt
  artifacts:
    paths:
      - multi-domain/aci/fmt_output.txt
      - multi-domain/aci/validate_output.txt
    expire_in: 7 days
  cache: []
  rules:
    - if: $CI_COMMIT_TAG == null

plan:
  stage: plan
  resource_group: apic
  script:
    - terraform version
    - terraform init -upgrade -input=false
    - terraform plan -out=plan.tfplan -input=false
    - terraform show -no-color plan.tfplan > plan.txt
  artifacts:
    paths:
      - multi-domain/aci/plan.txt
      - multi-domain/aci/plan.tfplan
    expire_in: 7 days
  needs:
    - validate
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never

deploy:
  stage: deploy
  resource_group: apic
  when: manual
  allow_failure: false
  script:
    - terraform apply -input=false -auto-approve plan.tfplan
  needs:
    - plan
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
    - when: never

destroy:
  stage: destroy
  resource_group: apic
  when: manual
  script:
    - terraform init
    - terraform destroy -auto-approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
