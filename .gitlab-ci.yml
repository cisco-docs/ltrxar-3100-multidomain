---
# LTRXAR-3100 Multi-Domain Orchestrator Pipeline
#
# Triggers the per-domain child pipelines in the order:
#   1. deploy-catc   (CATC fabrics, IP transit, BORDER + FIAB L3 handoffs)
#   2. deploy-sdwan  (SD-WAN C-EDGE-01 + C-EDGE-02 sites with CTS-aware handoff)
#
# Order rationale:
#   - CATC first  → fabrics + handoff configs come up; BGP advertises subnets
#   - SDWAN next  → cEdge handoff sub-ints + CTS interface mode TRUSTED
#
# ACI and ISE are deployed independently via their own submodule pipelines:
#   - ACI: under the simulator constraint (LEAF101 + LEAF102 only), there
#     is no separate border-leaf to register; multi-domain/aci/ was removed
#     and L3Outs are owned entirely by the parent aci/ submodule.
#   - ISE: SGT/SGACL/matrix/IP-SGT/NAD config lives in the parent ise/
#     submodule and is applied via that pipeline. Allow ~60–90s after the
#     ISE apply for CTS PAC provisioning + matrix download to the fabric
#     edges before validating Beat 3 (the headline drop).
#
# strategy: depend  -> parent pipeline waits for each child pipeline to finish
#                      and inherits its exit status. A failure in any child
#                      fails the orchestrator (preventing downstream stages).

stages:
  # - deploy-catc
  - deploy-sdwan

# deploy_catc:
#   stage: deploy-catc
#   trigger:
#     include: catc/.gitlab-ci.yml
#     strategy: depend
#   rules:
#     - if: '$CI_COMMIT_BRANCH == "master"'
#       when: always
#     - if: '$CI_COMMIT_BRANCH == "main"'
#       when: always

deploy_sdwan:
  stage: deploy-sdwan
  trigger:
    include: sdwan/.gitlab-ci.yml
    strategy: depend
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
