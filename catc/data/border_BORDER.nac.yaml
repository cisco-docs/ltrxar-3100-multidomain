---
# Fabric A border + control plane device (BORDER) and its L3 handoff toward
# C-EDGE-02 (Site 3 cEdge). Owned by multi-domain/catc/ because the device
# only exists at the cross-domain stitching boundary.
#
# Handoff plan (multi-domain/design.md §4):
#   BORDER Gi1/0/24 trunk to C-EDGE-02 Gi3:
#     VLAN 3010  Campus VN  10.100.30.1/30  EBGP peer 10.100.30.2  remote-as 65200
#   Fabric A local AS: 65001;  transit AS: 65200 (SD-WAN overlay).
#
# Only Campus VN is handed off here — Fabric A has no Guest/IoT VN. The
# Servers anycast gateway (also in Campus VN) shares this single L3 handoff
# because both gateways live in the same VN/VRF.
catalyst_center:
  inventory:
    devices:
      - name: BORDER
        fqdn_name: BORDER.cisco.eu
        device_ip: 198.18.130.10
        pid: C9KV-UADP-8P
        state: INIT
        device_role: BORDER ROUTER
        site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_site: Global/USA/Nevada/Las Vegas/Bld A
        fabric_roles:
          - BORDER_NODE
          - CONTROL_PLANE_NODE

  fabric:
    border_devices:
      - name: BORDER
        border_types:
          - LAYER_3
        default_exit: true
        import_external_routes: false
        local_autonomous_system_number: 65001
        l3_handoffs:
          - name: BGP-SDWAN
            interfaces:
              - name: GigabitEthernet1/0/24
                virtual_networks:
                  - name: Campus
                    vlan: 3010
                    local_ip_address: 10.100.30.1/30
                    peer_ip_address: 10.100.30.2/30
                    tcp_mss_adjustment: 1350
