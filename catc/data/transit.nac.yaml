---
# Shared IP transit toward the SDWAN overlay (AS 65200).
# Both Fabric A (BORDER) and Fabric B (FIAB) consume this transit on their
# respective L3 handoffs. One transit object, two consumers.
catalyst_center:
  fabric:
    transits:
      - name: BGP-SDWAN
        type: IP_BASED_TRANSIT
        routing_protocol_name: BGP
        autonomous_system_number: 65200
