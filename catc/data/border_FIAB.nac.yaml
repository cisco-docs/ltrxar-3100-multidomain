---
# Fabric B L3 handoff for FIAB toward C-EDGE-01 (Site 2 cEdge).
# FIAB device inventory entry lives in catc/data/devices.nac.yaml because
# FIAB also holds the EDGE_NODE role (camera endpoint). This file adds only
# the border_devices entry that wires the L3 handoff.
#
# Handoff plan (multi-domain/design.md §4):
#   FIAB Gi1/0/24 trunk to C-EDGE-01 Gi3:
#     VLAN 3050  IoT VN  10.100.50.1/30  EBGP peer 10.100.50.2  remote-as 65200
#   Fabric B local AS: 65002;  transit AS: 65200 (SD-WAN overlay).
catalyst_center:
  fabric:
    border_devices:
      - name: FIAB
        border_types:
          - LAYER_3
        default_exit: true
        import_external_routes: false
        local_autonomous_system_number: 65002
        l3_handoffs:
          - name: BGP-SDWAN
            interfaces:
              - name: GigabitEthernet1/0/24
                virtual_networks:
                  - name: IoT
                    vlan: 3050
                    local_ip_address: 10.100.50.1/30
                    peer_ip_address: 10.100.50.2/30
                    tcp_mss_adjustment: 1350
